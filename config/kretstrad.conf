# Set sleep timeout to 10 min
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=600000

# Combo configuration overrides
# CONFIG_ZMK_COMBO_MAX_COMBO_COUNT=64
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=12
# CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=4   # default value is also 4


# Enable mouse
CONFIG_ZMK_POINTING=y   
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Bluetooth configuratio and tweaks (6+1, ten dodatkowy slot to na drugą połówkę klawiatury)
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y              
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# System settings
CONFIG_ZMK_BATTERY_REPORTING=y

# Debouncing settings
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=20
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=20

# LED related settings
CONFIG_RGBLED_WIDGET=y
# CONFIG_RGBLED_WIDGET_INTERVAL_MS=250
# CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=50
# CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

# CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=y       # default N
# CONFIG_RGBLED_WIDGET_LAYER_BLINK_MS=100        # default 100
# CONFIG_RGBLED_WIDGET_LAYER_COLOR=6             # default 6 - Cyan

CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y        
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0           
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=2           
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=5           
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=6           
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=7           
# CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=5           # default 5 - Magenta
# CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=6           # default 6 - Cyan
# CONFIG_RGBLED_WIDGET_LAYER_7_COLOR=7           # default 7 - White