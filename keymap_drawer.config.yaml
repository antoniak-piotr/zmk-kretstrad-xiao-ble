    LCTRL: "CTRL"                                         # $$mdi:apple-keyboard-control$$
    LALT: "ALT"                                           # $$mdi:apple-keyboard-option$$
    LWIN: $$mdi:microsoft-windows$$                       # $$mdi:apple-keyboard-command$$

    UP: {tap: "UP", hold: $$mdi:chevron-up$$}             # $$mdi:arrow-up-bold$$
