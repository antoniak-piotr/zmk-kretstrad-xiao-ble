    LEFT: {tap: "LEFT", hold: $$mdi:chevron-left$$}       # $$mdi:arrow-left-bold$$
    RIGHT: {tap: "RIGHT", hold: $$mdi:chevron-right$$}    # $$mdi:arrow-right-bold$$
