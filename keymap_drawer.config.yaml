    END: {tap: "END", hold: $$mdi:page-last$$}            # $$mdi:chevron-right-circle-outline$$       #{tap: END, hold: $$mdi:chevron-right-circle-outline$$}
    PG_UP: {tap: "PGUP", hold: $$mdi:transfer-up$$}       # $$mdi:chevron-up-circle-outline$$
    PG_DN: {tap: "PGDN", hold: $$mdi:transfer-down$$}     # $$mdi:chevron-down-circle-outline$$

    GRAVE: "`"
    TILDE: "~"
    EXCL: "!"
    AT: "@"
    HASH: "#"
    DLLR: "$"
    PRCNT: "%"
    CARET: ^
    AMPS: "&"
    STAR: "*"
    LPAR: "("
    RPAR: ")"
    MINUS: "-"
    UNDER: "_"
    EQUAL: "="
    PLUS: "+"
    LBKT: "["
    LBRC: "{"
    RBKT: "]"
    RBRC: "}"
    BSLH: "\\"
    PIPE: "|"
    SEMI: ";"
    COLON: ":"
    APOS: "'" 
    DQT: "\""
    COMMA: ","
    LT: "<"
    DOT: "."
    GT: ">"
    FSLH: "/"
    QMARK: "?"
    

    # polskie literki
    LC(LA(A)): "Ą"
    LC(LA(C)): "Ć"
    LC(LA(E)): "Ę"
    LC(LA(L)): "Ł"
    LC(LA(N)): "Ń"
    LC(LA(O)): "Ó"
    LC(LA(S)): "Ś"
    LC(LA(X)): "Ź"
    LC(LA(Z)): "Ż"

    # ENTER: $$mdi:keyboard-return$$
