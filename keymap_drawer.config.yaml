draw_config:
  # key_h: 65
  # key_w: 65
  combo_w: 21
  combo_h: 13
  key_rx: 4
  key_ry: 4
  small_pad: 7.5
  # shrink_wide_legends: 5
  # glyph_tap_size: 24
  # glyph_hold_size: 10
  # glyph_shifted_size: 10

  arc_radius: 0
  # separate_combo_diagrams: False
  # draw_key_sides: True
  append_colon_to_layer_header: False
  use_local_cache: False
  # mark_alternate_layer_activators: True
  combo_diagrams_scale: 2

  svg_extra_style: |
    .none, .ghost, .trans {
      opacity: 0.7;
    }

    rect, path {
      shape-rendering: geometricPrecision;
    }

    .held {
      opacity: 1.0;
      filter: drop-shadow(0px 0px 6px #4FC0D0);
    }

    rect.combo, rect.combo-separate {
      fill: #CCDDFF;
      stroke: #99AACC;
    }

    text.combo, text.combo.hold, text.combo.shifted {
      font-size: 10px;
      dominant-baseline: central; 
      alignment-baseline: central; 
    }

    text.combo.tap:has(+ text.combo.shifted) { 
       text-anchor: end;
       translate: -0.75px 0;
    } 

    text.combo.tap + text.combo.shifted {
      fill: #FF0000;
      text-anchor: start;
      translate: 0.75px -1px;
    }

parse_config:
  mark_alternate_layer_activators: True
  # sticky_label: $$mdi:gesture-tap-hold$$

  trans_legend: {tap: ""}

  zmk_remove_keycode_prefix: ["KP_"]

  zmk_keycode_map:
