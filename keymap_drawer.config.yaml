    # CUT, COPY, PASTE
    LC(X): $$mdi:content-cut$$
    LC(C): $$mdi:content-copy$$
    LC(V): $$mdi:content-paste$$

    # DELPHI 
    LA(UP): "JUMP"
    LA(LEFT): {tap: "<BWRD", hold: $$mdi:step-backward$$}
    LA(RIGHT): {tap: "FWRD>", hold: $$mdi:step-forward$$}


